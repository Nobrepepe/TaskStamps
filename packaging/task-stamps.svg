<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241d17"/>
      <stop offset="1" stop-color="#12100f"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6cd85"/>
      <stop offset="1" stop-color="#e9a94f"/>
    </linearGradient>
    <linearGradient id="brassDim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfa04a"/>
      <stop offset="1" stop-color="#b87f34"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e9a94f" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#e9a94f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- plate -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="3" y="3" width="506" height="506" rx="110" fill="none"
        stroke="#f4ece1" stroke-opacity="0.10" stroke-width="6"/>

  <!-- ink glow under the press -->
  <ellipse cx="256" cy="356" rx="190" ry="70" fill="url(#glow)"/>

  <!-- stamp -->
  <rect x="204" y="88"  width="104" height="60"  rx="28" fill="url(#brass)"/>
  <rect x="232" y="138" width="48"  height="48"  fill="url(#brassDim)"/>
  <rect x="144" y="178" width="224" height="58"  rx="24" fill="url(#brass)"/>
  <rect x="168" y="242" width="176" height="98"  rx="16" fill="url(#brassDim)"/>

  <!-- checkmark pressed into the stamp face -->
  <path d="M214 292 L243 320 L300 262" fill="none" stroke="#17120f"
        stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the page it stamps -->
  <rect x="108" y="372" width="296" height="18" rx="9" fill="#f4ece1" fill-opacity="0.92"/>
  <rect x="150" y="414" width="126" height="14" rx="7" fill="#f4ece1" fill-opacity="0.28"/>
  <rect x="292" y="414" width="70"  height="14" rx="7" fill="#f4ece1" fill-opacity="0.16"/>
</svg>
