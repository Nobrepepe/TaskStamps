[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "task-stamps"
version = "0.1.0"
description = "Local-first habit tracker with collectible character stamps (Flet + SQLite)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "flet>=0.25.0,<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
task-stamps = "task_stamps.app:run"

[tool.setuptools.packages.find]
# vendor/worldhub-kit/py holds the shared World Hub package reader, vendored
# from World Hub's kit/ and verified against a lockfile. It is not edited here.
where = ["src", "vendor/worldhub-kit/py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "vendor/worldhub-kit/py"]
